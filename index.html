<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap');

        :root {
            --bg-color: #ffffff;
            --page-bg: #f0f0f2;
            --btn-gray: #e3e3e5;
            --btn-blue: #dbdcf9;
            --btn-eq: #8b6e79;
            --text-color: #1a1a1a;
            --ripple-color: rgba(0, 0, 0, 0.15);
            --ripple-color-light: rgba(255, 255, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--page-bg);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 820px;
            height: 100%;
            max-height: 900px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            padding: 18px 22px 22px 22px;
            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .history-btn,
        .menu-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a1a1a;
            transition: background-color 0.2s ease;
        }

        .history-btn:hover,
        .menu-btn:hover { background-color: #f0f0f2; }
        .history-btn:active,
        .menu-btn:active { background-color: #e3e3e5; }

        .history-btn svg {
            width: 24px; height: 24px;
            stroke: currentColor; stroke-width: 2.8;
            stroke-linecap: round; stroke-linejoin: round;
            fill: none;
        }
        .menu-btn svg { width: 24px; height: 24px; fill: currentColor; }

        .display {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 10px 8px 20px 8px;
            text-align: right;
            overflow: hidden;
            min-height: 0;
        }

        .previous-operand {
            color: #aaa;
            font-family: 'Comfortaa', sans-serif;
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            min-height: 1.1em;
        }

        .current-operand {
            color: var(--text-color);
            font-family: 'Comfortaa', sans-serif;
            font-size: 3.2rem;
            font-weight: 500;
            line-height: 1.05;
            letter-spacing: -0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .mode-switch {
            flex-shrink: 0;
            padding: 0 0 8px 4px;
            color: #666;
            font-size: 20px;
            font-weight: 300;
            cursor: pointer;
            user-select: none;
            letter-spacing: 3px;
            background: none;
            border: none;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            height: 30px;
            transition: color 0.2s;
        }
        .mode-switch:hover { color: #1a1a1a; }

        .keyboard-section {
            display: flex;
            gap: 0;
            height: 60%;
            flex-shrink: 0;
            width: 100%;
            transition: gap 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .keyboard-section.open { gap: 10px; }

        .scientific-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 0;
            opacity: 0;
            overflow: hidden;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.25s ease;
            flex-shrink: 0;
        }
        .keyboard-section.open .scientific-panel {
            width: calc(50% - 5px);
            opacity: 1;
        }

        .main-keyboard {
            flex: 1 1 auto;
            min-width: 0;
            height: 100%;
            display: flex;
            transition: flex 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            flex: 1 1 auto;
            min-width: 0;
            height: 100%;
        }

        button {
            border: none;
            outline: none;
            font-family: 'Roboto', sans-serif;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-color);
            border-radius: 100px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            min-height: 0;
            min-width: 0;
            position: relative;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            transition: background-color 0.2s ease;
        }

        .btn-gray { background-color: var(--btn-gray); }
        .btn-blue { background-color: var(--btn-blue); }
        .btn-eq { background-color: var(--btn-eq); color: white; }

        .scientific-panel button {
            font-size: 1.8rem;
            font-weight: 400;
        }

        /* Кнопка x^y - используется superscript через unicode */
        .btn-pow {
            font-size: 1.9rem;
            font-weight: 500;
        }

        .scientific-panel button.active {
            background-color: var(--btn-eq);
            color: white;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 600ms linear;
            pointer-events: none;
            background-color: var(--ripple-color);
        }
        .btn-eq .ripple, .scientific-panel button.active .ripple {
            background-color: var(--ripple-color-light);
        }

        @keyframes ripple-animation {
            to { transform: scale(4); opacity: 0; }
        }

        .btn-icon svg {
            width: 24px; height: 24px;
            fill: currentColor;
            position: relative;
            z-index: 1;
        }

        @media (max-height: 700px) {
            .calculator { padding: 12px 16px 16px 16px; border-radius: 20px; }
            .previous-operand { font-size: 1.3rem; }
            .current-operand { font-size: 2.4rem; }
            .keyboard-section { height: 65%; }
            .keypad { gap: 8px; }
            .scientific-panel { gap: 8px; }
            button { font-size: 1.2rem; }
            .scientific-panel button { font-size: 1.4rem; }
            .btn-pow { font-size: 1.5rem; }
            .history-btn, .menu-btn { width: 38px; height: 38px; }
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="top-bar">
        <button class="history-btn" onclick="showHistory()" aria-label="История">
            <svg viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M12 7v5l3.5 2"/>
            </svg>
        </button>
        <button class="menu-btn" onclick="showMenu()" aria-label="Меню">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="5" r="2.8"/>
                <circle cx="12" cy="12" r="2.8"/>
                <circle cx="12" cy="19" r="2.8"/>
            </svg>
        </button>
    </div>

    <div class="display">
        <div class="previous-operand"></div>
        <div class="current-operand">0</div>
    </div>

    <button class="mode-switch" onclick="toggleScientific()" id="modeToggle">
        &#10094;&#10095;
    </button>

    <div class="keyboard-section" id="keyboardSection">
        <!-- Инженерная панель -->
        <div class="scientific-panel">
            <button class="btn-blue" onclick="insertFunc('sqrt')">√</button>
            <button class="btn-blue" onclick="insertNumber('π')">π</button>
            <!-- ЗДЕСЬ: было ^, стало xʸ -->
            <button class="btn-blue btn-pow" onclick="insertOperator('^')">xʸ</button>
            <button class="btn-blue" onclick="insertOperator('!')">!</button>

            <button class="btn-blue" onclick="toggleRad()" id="radBtn">Rad</button>
            <button class="btn-blue sci-sin" onclick="insertFunc('sin')">sin</button>
            <button class="btn-blue sci-cos" onclick="insertFunc('cos')">cos</button>
            <button class="btn-blue sci-tan" onclick="insertFunc('tan')">tan</button>

            <button class="btn-blue" onclick="toggleInv()" id="invBtn">Inv</button>
            <button class="btn-blue" onclick="insertNumber('e')">e</button>
            <button class="btn-blue sci-ln" onclick="insertFunc('ln')">ln</button>
            <button class="btn-blue sci-log" onclick="insertFunc('log')">log</button>
        </div>

        <!-- Основная клавиатура -->
        <div class="main-keyboard">
            <div class="keypad">
                <button class="btn-blue" onclick="clearDisplay()">AC</button>
                <button class="btn-blue" onclick="insertOperator('(')">(</button>
                <button class="btn-blue" onclick="insertOperator(')')">)</button>
                <button class="btn-blue" onclick="insertOperator('/')">÷</button>

                <button class="btn-gray" onclick="insertNumber('7')">7</button>
                <button class="btn-gray" onclick="insertNumber('8')">8</button>
                <button class="btn-gray" onclick="insertNumber('9')">9</button>
                <button class="btn-blue" onclick="insertOperator('*')">×</button>

                <button class="btn-gray" onclick="insertNumber('4')">4</button>
                <button class="btn-gray" onclick="insertNumber('5')">5</button>
                <button class="btn-gray" onclick="insertNumber('6')">6</button>
                <button class="btn-blue" onclick="insertOperator('-')">−</button>

                <button class="btn-gray" onclick="insertNumber('1')">1</button>
                <button class="btn-gray" onclick="insertNumber('2')">2</button>
                <button class="btn-gray" onclick="insertNumber('3')">3</button>
                <button class="btn-blue" onclick="insertOperator('+')">+</button>

                <button class="btn-gray" onclick="insertNumber('0')">0</button>
                <button class="btn-gray" onclick="insertNumber('.')">.</button>
                <button class="btn-gray btn-icon" onclick="deleteNumber()">
                    <svg viewBox="0 0 24 24">
                        <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/>
                    </svg>
                </button>
                <button class="btn-eq" onclick="calculate()">=</button>
            </div>
        </div>
    </div>
</div>

<script>
/* =========================================================
   КАЛЬКУЛЯТОР С ПОЛНОЦЕННЫМ ПАРСЕРОМ ВЫРАЖЕНИЙ
   ========================================================= */

const currentOperandTextElement = document.querySelector('.current-operand');
const previousOperandTextElement = document.querySelector('.previous-operand');

let expression = '';
let isRad = true;
let isInv = false;

/* ---------- ВВОД ---------- */

function updateDisplay() {
    let display = expression || '0';
    display = display.replace(/\*/g, '×')
                     .replace(/\//g, '÷')
                     .replace(/-/g, '−')
                     .replace(/sqrt/g, '√')
                     .replace(/pi/g, 'π');
    currentOperandTextElement.innerText = display;
    previousOperandTextElement.innerText = '';
}

function insertNumber(num) {
    if (num === 'π') expression += 'π';
    else if (num === 'e') expression += 'e';
    else if (num === '.') {
        const last = expression.split(/[^0-9.]/).pop();
        if (last.includes('.')) return;
        expression += '.';
    }
    else expression += num;
    updateDisplay();
}

function insertOperator(op) {
    const lastChar = expression.slice(-1);
    const operators = ['+', '-', '*', '/', '^'];
    if (operators.includes(op) && operators.includes(lastChar)) {
        expression = expression.slice(0, -1) + op;
    } else {
        expression += op;
    }
    updateDisplay();
}

function insertFunc(func) {
    if (isInv) {
        switch (func) {
            case 'sin': func = 'asin'; break;
            case 'cos': func = 'acos'; break;
            case 'tan': func = 'atan'; break;
            case 'ln':  func = 'exp'; break;
            case 'log': func = 'pow10'; break;
        }
    }
    expression += func + '(';
    updateDisplay();
}

function deleteNumber() {
    expression = expression.slice(0, -1);
    updateDisplay();
}

function clearDisplay() {
    expression = '';
    updateDisplay();
}

/* ---------- ПЕРЕКЛЮЧАТЕЛИ ---------- */

function toggleScientific() {
    const section = document.getElementById('keyboardSection');
    const toggleBtn = document.getElementById('modeToggle');
    section.classList.toggle('open');
    toggleBtn.innerHTML = section.classList.contains('open') 
        ? '&#10095;&#10094;' 
        : '&#10094;&#10095;';
}

function toggleRad() {
    isRad = !isRad;
    document.getElementById('radBtn').innerText = isRad ? 'Rad' : 'Deg';
}

function toggleInv() {
    isInv = !isInv;
    const invBtn = document.getElementById('invBtn');
    const sinBtn = document.querySelector('.sci-sin');
    const cosBtn = document.querySelector('.sci-cos');
    const tanBtn = document.querySelector('.sci-tan');
    const lnBtn  = document.querySelector('.sci-ln');
    const logBtn = document.querySelector('.sci-log');
    
    if (isInv) {
        invBtn.classList.add('active');
        sinBtn.innerText = 'sin⁻¹';
        cosBtn.innerText = 'cos⁻¹';
        tanBtn.innerText = 'tan⁻¹';
        lnBtn.innerText  = 'eˣ';
        logBtn.innerText = '10ˣ';
    } else {
        invBtn.classList.remove('active');
        sinBtn.innerText = 'sin';
        cosBtn.innerText = 'cos';
        tanBtn.innerText = 'tan';
        lnBtn.innerText  = 'ln';
        logBtn.innerText = 'log';
    }
}

/* =========================================================
   ПАРСЕР ВЫРАЖЕНИЙ
   ========================================================= */

function evaluateExpression(expr) {
    expr = expr.replace(/π/g, '(pi)')
               .replace(/√/g, 'sqrt')
               .replace(/×/g, '*')
               .replace(/÷/g, '/')
               .replace(/−/g, '-');

    const tokens = tokenize(expr);
    const parser = new Parser(tokens);
    const result = parser.parseExpression();
    
    if (parser.pos < parser.tokens.length) {
        throw new Error('Unexpected token: ' + parser.tokens[parser.pos]);
    }
    
    if (!isFinite(result)) throw new Error('Math error');
    return result;
}

function tokenize(expr) {
    const tokens = [];
    let i = 0;
    while (i < expr.length) {
        const ch = expr[i];
        
        if (ch === ' ') { i++; continue; }
        
        if (/[0-9.]/.test(ch)) {
            let num = '';
            while (i < expr.length && /[0-9.]/.test(expr[i])) {
                num += expr[i++];
            }
            tokens.push({ type: 'number', value: parseFloat(num) });
            continue;
        }
        
        if (/[a-zA-Z]/.test(ch)) {
            let name = '';
            while (i < expr.length && /[a-zA-Z]/.test(expr[i])) {
                name += expr[i++];
            }
            tokens.push({ type: 'name', value: name });
            continue;
        }
        
        if ('+-*/^!%(),'.includes(ch)) {
            tokens.push({ type: 'op', value: ch });
            i++;
            continue;
        }
        
        throw new Error('Unknown character: ' + ch);
    }
    return tokens;
}

class Parser {
    constructor(tokens) {
        this.tokens = tokens;
        this.pos = 0;
    }
    
    peek() { return this.tokens[this.pos]; }
    next() { return this.tokens[this.pos++]; }
    
    parseExpression() {
        let left = this.parseTerm();
        while (this.peek() && this.peek().type === 'op' && '+-'.includes(this.peek().value)) {
            const op = this.next().value;
            const right = this.parseTerm();
            left = op === '+' ? left + right : left - right;
        }
        return left;
    }
    
    parseTerm() {
        let left = this.parsePower();
        while (this.peek() && this.peek().type === 'op' && '*/%'.includes(this.peek().value)) {
            const op = this.next().value;
            const right = this.parsePower();
            if (op === '*') left = left * right;
            else if (op === '/') {
                if (right === 0) throw new Error('Division by zero');
                left = left / right;
            }
            else if (op === '%') left = left % right;
        }
        return left;
    }
    
    parsePower() {
        let base = this.parseUnary();
        if (this.peek() && this.peek().type === 'op' && this.peek().value === '^') {
            this.next();
            const exp = this.parsePower();
            base = Math.pow(base, exp);
        }
        return base;
    }
    
    parseUnary() {
        if (this.peek() && this.peek().type === 'op' && this.peek().value === '-') {
            this.next();
            return -this.parseUnary();
        }
        if (this.peek() && this.peek().type === 'op' && this.peek().value === '+') {
            this.next();
            return this.parseUnary();
        }
        return this.parseFactorial();
    }
    
    parseFactorial() {
        let val = this.parsePrimary();
        while (this.peek() && this.peek().type === 'op' && this.peek().value === '!') {
            this.next();
            val = factorial(val);
        }
        return val;
    }
    
    parsePrimary() {
        const token = this.peek();
        
        if (!token) throw new Error('Unexpected end of expression');
        
        if (token.type === 'number') {
            this.next();
            return token.value;
        }
        
        if (token.type === 'name') {
            this.next();
            const name = token.value;
            
            if (name === 'pi') return Math.PI;
            if (name === 'e') return Math.E;
            
            if (this.peek() && this.peek().type === 'op' && this.peek().value === '(') {
                this.next();
                const arg = this.parseExpression();
                if (!this.peek() || this.peek().value !== ')') {
                    throw new Error('Missing closing paren');
                }
                this.next();
                return applyFunction(name, arg);
            }
            
            throw new Error('Unknown name: ' + name);
        }
        
        if (token.type === 'op' && token.value === '(') {
            this.next();
            const val = this.parseExpression();
            if (!this.peek() || this.peek().value !== ')') {
                throw new Error('Missing closing paren');
            }
            this.next();
            return val;
        }
        
        throw new Error('Unexpected token: ' + token.value);
    }
}

function applyFunction(name, x) {
    const toRad = (v) => isRad ? v : v * Math.PI / 180;
    const fromRad = (v) => isRad ? v : v * 180 / Math.PI;
    
    switch (name) {
        case 'sqrt':
            if (x < 0) throw new Error('√ of negative');
            return Math.sqrt(x);
        case 'sin':   return Math.sin(toRad(x));
        case 'cos':   return Math.cos(toRad(x));
        case 'tan':   return Math.tan(toRad(x));
        case 'asin':
            if (x < -1 || x > 1) throw new Error('asin out of range');
            return fromRad(Math.asin(x));
        case 'acos':
            if (x < -1 || x > 1) throw new Error('acos out of range');
            return fromRad(Math.acos(x));
        case 'atan':  return fromRad(Math.atan(x));
        case 'ln':
            if (x <= 0) throw new Error('ln of non-positive');
            return Math.log(x);
        case 'log':
            if (x <= 0) throw new Error('log of non-positive');
            return Math.log10(x);
        case 'exp':   return Math.exp(x);
        case 'pow10': return Math.pow(10, x);
        default: throw new Error('Unknown function: ' + name);
    }
}

function factorial(n) {
    if (n < 0) throw new Error('Factorial of negative');
    if (!Number.isInteger(n)) throw new Error('Factorial of non-integer');
    if (n > 170) throw new Error('Too large');
    let result = 1;
    for (let i = 2; i <= n; i++) result *= i;
    return result;
}

/* ---------- ВЫЧИСЛЕНИЕ ---------- */

function calculate() {
    if (!expression.trim()) return;
    
    try {
        let expr = expression;
        const openCount = (expr.match(/\(/g) || []).length;
        const closeCount = (expr.match(/\)/g) || []).length;
        for (let i = 0; i < openCount - closeCount; i++) expr += ')';
        
        const result = evaluateExpression(expr);
        
        let rounded;
        if (Math.abs(result) < 1e-10) rounded = 0;
        else rounded = Math.round(result * 1e10) / 1e10;
        
        previousOperandTextElement.innerText = expression + ' =';
        currentOperandTextElement.innerText = formatNumber(rounded);
        
        expression = rounded.toString();
    } catch (e) {
        currentOperandTextElement.innerText = 'Ошибка';
        previousOperandTextElement.innerText = expression;
        expression = '';
        setTimeout(() => {
            currentOperandTextElement.innerText = '0';
            previousOperandTextElement.innerText = '';
        }, 1500);
    }
}

function formatNumber(num) {
    if (!isFinite(num)) return '∞';
    if (Math.abs(num) > 1e15 || (Math.abs(num) < 1e-6 && num !== 0)) {
        return num.toExponential(6);
    }
    let str = num.toString();
    if (str.includes('.')) {
        str = str.replace(/\.?0+$/, '');
    }
    return str.replace('.', ',');
}

/* ---------- ПРОЧЕЕ ---------- */

function showHistory() { console.log('История'); }
function showMenu() { console.log('Меню'); }

updateDisplay();

document.querySelectorAll('button').forEach(button => {
    button.addEventListener('pointerdown', function(e) {
        const existingRipple = this.querySelector('.ripple');
        if (existingRipple) existingRipple.remove();

        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;

        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;

        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    });
});

document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') insertNumber(e.key);
    else if (e.key === '.') insertNumber('.');
    else if (e.key === '+') insertOperator('+');
    else if (e.key === '-') insertOperator('-');
    else if (e.key === '*') insertOperator('*');
    else if (e.key === '/') { e.preventDefault(); insertOperator('/'); }
    else if (e.key === '(' || e.key === ')') insertOperator(e.key);
    else if (e.key === '^') insertOperator('^');
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
    else if (e.key === 'Backspace') deleteNumber();
    else if (e.key === 'Escape') clearDisplay();
});
</script>

</body>
